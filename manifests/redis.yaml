---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
  namespace: core
  labels:
    app: db-deployment
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db # match with pod labels
  template:
    metadata:
      labels:
        app: db
        tier: backend
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: core
  labels:
    app: redis-db-service
    tier: backend
spec:
  selector:
    app: db
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
