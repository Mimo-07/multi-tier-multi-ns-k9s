apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-from-web
  namespace: client
spec:
  podSelector:
    matchLabels:
      app: client-server
      tier: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: core
          podSelector:
            matchLabels:
              app: api
              tier: backend
      ports:
        - protocol: TCP
          port: 80
